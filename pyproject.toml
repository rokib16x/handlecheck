[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handlecheck"
version = "0.2.0"
description = "Check whether a username exists on YouTube, TikTok, Instagram, Facebook, X, GitHub and Reddit without logging in. CLI, library, MCP server and HTTP API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "github", "reddit", "twitter", "username", "osint", "social-media", "tiktok", "instagram", "facebook", "youtube"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]  # needs Python 3.10+
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
handlecheck = "handlecheck.cli:main"
handlecheck-mcp = "handlecheck.mcp_server:main"
handlecheck-api = "handlecheck.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/handlecheck"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: hits real websites (run with: pytest -m live)"]

[tool.ruff]
line-length = 100
