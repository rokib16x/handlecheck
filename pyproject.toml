[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handlecheck"
version = "0.1.0"
description = "Check whether a username exists on YouTube, TikTok, Instagram and Facebook without logging in."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["username", "osint", "social-media", "tiktok", "instagram", "facebook", "youtube"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
handlecheck = "handlecheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/handlecheck"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: hits real websites (run with: pytest -m live)"]

[tool.ruff]
line-length = 100
